[package]
name = "vlazba"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
authors = ["lagleki <gleki.is.my.name@gmail.com>"]
description = "Lojban words generator and analyzer"
license = "GPL-3.0"
repository = "https://github.com/la-lojban/vlazba"
readme = "README.md"
keywords = ["lojban", "nlp", "conlang"]
categories = ["text-processing", "parser-implementations"]

[lib]
name = "vlazba"
path = "src/lib.rs"

[[bin]]
name = "vlazba"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "morphology"
harness = false
required-features = ["parallel"]

[features]
default = ["parallel", "cli"]
parallel = ["dep:rayon"]
cli = ["dep:clap", "dep:anyhow"]
camxes = ["dep:camxes-rs"]

[dependencies]
clap = { version = "4.6", optional = true }
rayon = { version = "1.12", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = { version = "1.0.104", optional = true }
smallvec = "1.16"
thiserror = "2"
camxes-rs = { version = "1.1.1", optional = true }

[dev-dependencies]
criterion = "0.5"

[profile.release]
panic = "abort"
debug = false
lto = "thin"
codegen-units = 1
opt-level = 3
overflow-checks = false
incremental = false
